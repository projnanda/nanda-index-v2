# NANDA Index — production stack
#
# Prerequisites:
#   1. cp .env.prod.example .env.prod  — fill in all values
#   2. docker compose -f docker-compose.prod.yml --env-file .env.prod up --build -d
#
# Caddy exposes (open these ports in your Droplet firewall):
#   :80  → HTTP (redirects to HTTPS automatically)
#   :443 → nandaindex.org (web, /demo → concierge demo) + api.nandaindex.org (API)
#
# Postgres is internal only — not reachable from outside.

services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nanda_index
      POSTGRES_USER: nanda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nanda -d nanda_index"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://nanda:${POSTGRES_PASSWORD}@db:5432/nanda_index
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      OAUTH_CALLBACK_BASE_URL: ${OAUTH_CALLBACK_BASE_URL}
      # Resend API key. Required: the server refuses to start in production
      # with SMTP_URL unset or "log", which would print password-reset and
      # verification tokens to docker logs. ALLOW_EMAIL_LOG_IN_PRODUCTION=true
      # overrides that (never on the live site).
      SMTP_URL: ${SMTP_URL:-}
      ALLOW_EMAIL_LOG_IN_PRODUCTION: ${ALLOW_EMAIL_LOG_IN_PRODUCTION:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@nandaindex.org}
      FRONTEND_URL: ${FRONTEND_URL}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-10}
      ORG_RECOVERY_RATE_LIMIT_MAX: ${ORG_RECOVERY_RATE_LIMIT_MAX:-30}
      COOKIE_SECRET: ${COOKIE_SECRET}
      # Caddy is the one proxy in front: trust its X-Forwarded-For so per-IP rate
      # limits and login lockout apply per visitor, not to Caddy's address. Safe only because this
      # service publishes no port — keep it that way.
      TRUST_PROXY_HOPS: "1"
      # Public API origin — the ARD registry document (GET /api/ard) advertises it.
      API_BASE_URL: ${API_BASE_URL:-https://api.nandaindex.org}
      # Write-time representative-query enrichment for search; skipped when unset.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_ENRICHMENT_MODEL: ${OPENAI_ENRICHMENT_MODEL:-gpt-4o-mini}
      # PostHog: anonymous account/entry lifecycle counts (server/src/services/analytics.ts).
      # Same project key as the web app; off when unset.
      POSTHOG_API_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
      POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
      # Index operators (comma-separated, Google/GitHub sign-in only): may
      # moderate entries via /api/v1/admin/* and register reserved org_ids.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Per-IP limits on public reads; agentic/ARD search fan out, so tighter.
      PUBLIC_RATE_LIMIT_MAX: ${PUBLIC_RATE_LIMIT_MAX:-120}
      SEARCH_RATE_LIMIT_MAX: ${SEARCH_RATE_LIMIT_MAX:-30}
      # Seconds the index total (X-Total-Count) and ARD facet counts are reused
      # before recounting every listed entry; 0 = recount on every request.
      INDEX_STATS_CACHE_SECONDS: ${INDEX_STATS_CACHE_SECONDS:-60}
    depends_on:
      db:
        condition: service_healthy
    # GET /health pings the database. start_period covers the migrations that
    # entrypoint.sh runs before the server listens.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_NANDA_INDEX_API_URL: ${NEXT_PUBLIC_NANDA_INDEX_API_URL}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
    environment:
      PORT: 3000
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # The concierge demo, served at https://nandaindex.org/demo (see Caddyfile).
  # Its signing key, grant and last run live on the demo_data volume: the agent's
  # name is derived from the key, so losing the volume makes it a different,
  # unregistered, unauthorised agent. No port is published — only Caddy reaches
  # it, which is what makes X-Forwarded-For trustworthy for the run limit.
  demo:
    build:
      context: ./demo
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      CONCIERGE_BASE_URL: ${DEMO_BASE_URL:-https://nandaindex.org/demo}
      CONCIERGE_HOME: /data/concierge
      CONCIERGE_AUTHORITY: /data/authority
      CONCIERGE_LAST_RUN: /data/last-run.json
      CONCIERGE_RECEIPTS: /data/receipts
      CONCIERGE_BEHIND_PROXY: "1"
      # Live runs per visitor per hour; each one messages two companies' agents
      # and holds a real table under the host's grant. 0 disables the limit.
      RUN_LIMIT_PER_HOUR: ${DEMO_RUN_LIMIT_PER_HOUR:-3}
      PUBLIC_INDEX_URL: ${DEMO_PUBLIC_INDEX_URL:-https://api.nandaindex.org}
    volumes:
      - demo_data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./static:/srv/static:ro
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_healthy
      demo:
        condition: service_started
    restart: unless-stopped

volumes:
  demo_data:
  db_data:
  caddy_data:
  caddy_config:
