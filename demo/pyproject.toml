[project]
name = "index-v2-demo"
version = "0.1.0"
description = "A NANDA Index v2 demo: an agent that discovers other organisations' agents through the index and books on its principal's behalf."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk>=1.1.2",
    # The published Agency Receipt Protocol. The venue issues ARP receipts and
    # so does this agent; a bespoke second format made the two ends of one
    # booking unpairable by the published verifier.
    "sm-arp>=0.3.2",
    # The delegated authority grant this agent runs under. sm-arp never imports
    # sm-dat; the rich verifier is injected, so this is only needed to *check* a
    # grant, which the page does.
    "sm-dat>=0.2.0",
    "httpx>=0.27",
    "cryptography>=42",
    "base58>=2.1",
    "jcs>=0.2",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

# The demo page is data, not code, so setuptools will not pick it up on its
# own. Without this the container installs a package whose /ui returns a
# missing-file error, and nothing at build time says so.
[tool.setuptools.package-data]
# The page is data, and so is the host's grant: without this the container
# installs an agent that refuses every run because it holds no authority,
# and nothing at build time says so.
concierge = ["ui/*.html", "authority/*.json"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 112
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    # The browser tests. Separated so the offline gate can run without a
    # 150MB browser present, and say which it did.
    "ui: drives the page in a real browser; needs playwright and chromium",
]

