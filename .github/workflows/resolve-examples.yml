name: Resolve examples
on:
  pull_request:
    paths: ['web/**', '.github/workflows/resolve-examples.yml']
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/resolve-examples.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify every preset over HTTP
        run: |
          npm start -- --port 3000 > /tmp/resolve-examples.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3000/resolve > /dev/null; then break; fi
            sleep 1
          done
          node scripts/check-resolve-examples.mjs http://127.0.0.1:3000
