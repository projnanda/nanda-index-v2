# NANDA Index — full stack
#
# Spins up: Postgres DB, Index Server (Fastify), Index Web (Next.js)
#
# Quick start:
#   cp .env.example .env
#   docker compose up --build
#
# Index API:  http://localhost:3001
# Index Web:  http://localhost:3000
# Ports are bound to 127.0.0.1 only: the defaults below are well-known dev
# credentials, so this stack must never be reachable from the network.

services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nanda_index
      POSTGRES_USER: nanda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nanda-local}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nanda -d nanda_index"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://nanda:${POSTGRES_PASSWORD:-nanda-local}@db:5432/nanda_index
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      COOKIE_SECRET: ${COOKIE_SECRET:-dev-cookie-secret-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      OAUTH_CALLBACK_BASE_URL: ${OAUTH_CALLBACK_BASE_URL:-http://localhost:3001}
      SMTP_URL: ${SMTP_URL:-log}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@nanda.local}
      COMMUNITY_CONTACT_EMAIL: ${COMMUNITY_CONTACT_EMAIL:-}
      COMMUNITY_CONTACT_CC: ${COMMUNITY_CONTACT_CC:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-10}
      # PostHog: anonymous account/entry lifecycle counts (server/src/services/analytics.ts).
      # Same project key as the web app; off when unset.
      POSTHOG_API_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
      POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
      ORG_RECOVERY_RATE_LIMIT_MAX: ${ORG_RECOVERY_RATE_LIMIT_MAX:-30}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_NANDA_INDEX_API_URL: ${NEXT_PUBLIC_NANDA_INDEX_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
    environment:
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  db_data:
